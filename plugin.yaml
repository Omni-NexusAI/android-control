name: droidclaw
title: Android Control
version: 1.0.0
description: Android device control via ADB with LLM-guided navigation and workflow automation
always_enabled: true
dependencies:
  - zeroconf
  - cryptography
config_schema:
  defaults:
    type: object
    description: Default settings for Android Control
    properties:
      device:
        type: string
        description: Default ADB device serial/IP (empty = auto-detect)
      adb_path:
        type: string
        description: Optional absolute path to adb. Leave empty to use PATH, plugin-owned platform-tools, or Android SDK defaults.
      adb_backend:
        type: string
        description: "auto_container_first, auto, host, container, or auto_host_first"
      adb_host:
        type: string
        description: Host ADB server hostname when adb_backend is host/auto
      adb_port:
        type: integer
        description: Host ADB server port
      adb_keepalive:
        type: boolean
        description: Ping wireless devices that are in use so their ADB transport does not idle out
      adb_keepalive_interval:
        type: integer
        description: Seconds between keepalive pings for in-use wireless devices
      provider:
        type: string
        description: LLM provider (ollama, lm_studio, groq, openrouter, openai, anthropic)
      default_model:
        type: string
        description: Default model for execution
      model_supports_vision:
        type: boolean
        description: Whether the configured model can accept image inputs
      api_base:
        type: string
        description: Custom API base URL (empty = provider default)
      vision_mode:
        type: string
        description: "off, fallback (attach an annotated screenshot only when the element list is not enough), or always"
      vision_image_max_edge:
        type: integer
        description: Longest edge in pixels of screenshots sent to the model (smaller = fewer tokens)
      tier:
        type: string
        description: "auto, tier1, tier2, tier3"
      max_steps:
        type: integer
        description: Maximum steps for execution
      stuck_threshold:
        type: integer
        description: Steps without progress before intervention
      step_delay:
        type: integer
        description: Seconds between steps
      max_elements:
        type: integer
        description: Maximum UI elements to parse
      preview_fps:
        type: integer
        description: Default live preview frame rate (12, 24, 30, 40 or 60)
      preview_max_size:
        type: integer
        description: Longest edge in pixels of the live preview stream
      preview_bit_rate:
        type: integer
        description: Live preview H.264 bit rate in bits per second
      auto_intervene:
        type: boolean
        description: Monitor and intervene when stuck
settings_sections:
  - defaults
per_project_config: true
per_agent_config: true
